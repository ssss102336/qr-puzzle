<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>어린왕자 퍼즐</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- 퍼즐 조각을 찾았을 때 -->

    <div id="piecePage">

        <div class="small-title">
            THE LITTLE PRINCE
        </div>

        <h1>퍼즐 조각을 찾았습니다.</h1>

        <p id="pieceMessage">
            새로운 조각이 하나 모였습니다.
        </p>

        <!-- 지금 모은 조각 표시 -->
        <div class="piece-preview">
            <img id="pieceImage" src="" alt="퍼즐 조각">
        </div>

        <p id="collectionCount">
            퍼즐 조각 1 / 6
        </p>

        <button
            id="backButton"
            class="button"
            onclick="goBack()">
            돌아가기
        </button>

        <!-- 6개 완성 후 나타남 -->
        <button
            id="completeButton"
            class="button complete-button"
            onclick="showNewImage()"
            style="display:none;">
            새로운 이미지 보기
        </button>

    </div>


    <!-- 완성 이미지 -->

    <div
        id="completePage"
        style="display:none;">

        <div class="small-title">
            JOURNEY COMPLETE
        </div>

        <h1>여정이 완성되었습니다.</h1>

        <p>
            흩어져 있던 조각들이<br>
            하나의 모습으로 완성되었습니다.
        </p>

        <div class="new-image-box">
            <img
                id="newImage"
                src=""
                alt="완성 이미지">
        </div>

        <p class="complete-text">
            어린왕자의 여정에서 모은<br>
            여섯 개의 조각이 하나가 되었습니다.
        </p>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
